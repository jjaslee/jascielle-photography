<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A visual study of memory and light."
    />
    <title>Jascielle Photography</title>
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero/hero-poster-1536.webp"
      imagesrcset="/images/hero/hero-poster-640.webp 640w, /images/hero/hero-poster-960.webp 960w, /images/hero/hero-poster-1400.webp 1400w, /images/hero/hero-poster-1536.webp 1536w"
      imagesizes="(max-width: 767px) 72vw, (min-width: 1474px) 560px, 38vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&family=Manrope:wght@400;500;600;700;800&family=Pinyon+Script&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var key = 'jascielle-theme'
        var stored = localStorage.getItem(key)
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
